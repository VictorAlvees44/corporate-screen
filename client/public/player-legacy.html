<html lang="pt-BR">

  <title>Corporate Screen - Player para TVs</title>
  <style>

    .layout-text, .layout-widget { width: 100%; height: 100%; display: table; background: rgba(0,0,0,.58); color: #fff; }
    .layout-text > div, .layout-widget > div { display: table-cell; vertical-align: middle; padding: 12px; text-align: center; }
    .layout-clock { font-size: 42px; font-weight: bold; font-family: monospace; }
    .layout-news { font-size: 18px; text-align: left !important; opacity: 1; transition: opacity .4s ease; }

    .footer-widget { width: 100%; height: 100%; overflow: hidden; background: rgba(6,11,16,.95); color: #fff; padding: 9px 12px; }
    .footer-clock { display: table; padding: 0 4px; text-align: center; }
    .footer-clock-content { display: table-cell; vertical-align: middle; }
    .footer-clock-time { display: block; font: bold 32px monospace; line-height: 1; white-space: nowrap; }
    .footer-clock-date { display: block; color: #cbd5e1; font-size: 11px; margin-top: 7px; white-space: nowrap; }
    .footer-weather-current { display: inline-block; vertical-align: middle; white-space: nowrap; }
    .footer-weather-icon { font-size: 34px; vertical-align: middle; }
    .footer-weather-temp { font-size: 28px; font-weight: bold; vertical-align: middle; margin-left: 5px; }
    .footer-weather-city { display: block; color: #94a3b8; font-size: 10px; margin-top: 2px; text-align: center; }
    .footer-weather-days { display: inline-block; width: 52%; margin-left: 4%; vertical-align: middle; border-left: 1px solid rgba(255,255,255,.12); padding-left: 4%; white-space: nowrap; }
    .footer-weather-day { display: inline-block; width: 32%; text-align: center; color: #cbd5e1; font-size: 10px; }
    .footer-weather-day span { display: block; font-size: 16px; line-height: 1.1; }
    .footer-news-source { color: #22a7ff; font-size: 12px; font-weight: bold; }
    .footer-news-category, .footer-news-date { color: #94a3b8; font-size: 10px; }
    .footer-news-title { font-size: 22px; font-weight: bold; line-height: 1.16; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .footer-news-summary { color: #cbd5e1; font-size: 13px; line-height: 1.25; margin-top: 3px; max-height: 2.5em; overflow: hidden; }
    .footer-widget.layout-news { position: relative; }
    .footer-widget.layout-news > div { height: 100%; overflow: hidden; }
    .footer-news-image { float: left; display: block; width: 16%; max-width: 112px; height: 72px; max-height: 100%; margin-right: 12px; border-radius: 4px; object-fit: cover; }
    .message { height: 100%; display: table; width: 100%; text-align: center; }
    .message > div { display: table-cell; vertical-align: middle; padding: 30px; }
    .message h1 { font-size: 28px; margin: 0 0 16px; }
    .message p { color: #cbd5e1; font-size: 18px; line-height: 1.5; margin: 0; }
    .identity { position: absolute; right: 12px; bottom: 10px; padding: 5px 8px; background: rgba(0,0,0,.55); color: #cbd5e1; font-size: 11px; }
    .video-start-prompt { position: absolute; z-index: 40; left: 10%; right: 10%; top: 36%; padding: 24px; border: 2px solid #22d3ee; border-radius: 8px; background: rgba(2,6,23,.96); color: #fff; text-align: center; font-size: 22px; line-height: 1.4; }
    .video-start-prompt strong { display: block; margin-bottom: 8px; color: #67e8f9; font-size: 26px; }
  </style>

<body>
  <div id="screen"><div class="message"><div><h1>Corporate Screen</h1><p>Conectando esta TV...</p></div></div></div>
  <noscript><div style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;background:#000;color:#fff;padding:40px;font:24px Arial">Não é possível transmitir: JavaScript está desativado ou não é compatível com este navegador.</div></noscript>
  <script src="/player-diagnostics.js?v=2026-09-11.1"></script>
  <script>

    var currentIndex = 0;
    var currentTimer = null;
    var currentVideo = null;
    var videoStartTimer = null;
    var videoStartAttempts = 0;
    var videoPrompt = null;
    var lastSignature = '';
    var currentLayout = null;
    var currentTV = null;
    var layoutTimers = [];
    var footerTimers = [];
    var standardFooter = null;
    var footerSignature = '';
    var newsItemsCache = [];

    var syncCycleStartedAt = '';
    var serverOffsetMs = 0;
    var conservativeSamsungVideo = needsConservativeSamsungVideo();

      var value = 'legacy-' + new Date().getTime().toString(36) + '-' + Math.random().toString(36).slice(2) + '-' + Math.random().toString(36).slice(2);

      return value;
    }
    if (!deviceId) deviceId = createDeviceId();
    function showMessage(title, text) {
      if (window.CorporateScreenPower) window.CorporateScreenPower.setDesired(false);
      lastSignature = '';
      if (stopWatching) { stopWatching(); stopWatching = null; }
      clearTimer();
      clearLayoutTimers();
      clearFooterTimers();
      standardFooter = null;
      footerSignature = '';
      screen.innerHTML = '<div class="message"><div><h1>' + escapeHtml(title) + '</h1><p>' + escapeHtml(text) + '</p></div></div>';
    }
    function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

    function clearVideoStartTimer() { if (videoStartTimer) { window.clearTimeout(videoStartTimer); videoStartTimer = null; } }
    function removeVideoPrompt() {
      if (videoPrompt && videoPrompt.parentNode) videoPrompt.parentNode.removeChild(videoPrompt);

    }
    function absoluteMediaUrl(value) {

    }
    function markVideoStarted(video) {

      if ((Number(video.currentTime) || 0) <= 0 && video.paused !== false) return;
      clearVideoStartTimer();
      removeVideoPrompt();
    }
    function showVideoStartPrompt() {
      if (videoPrompt || !currentVideo) return;
      videoPrompt = document.createElement('div');
      videoPrompt.className = 'video-start-prompt';
      videoPrompt.innerHTML = '<strong>O vídeo precisa ser iniciado</strong>Pressione OK ou Enter uma vez no controle remoto. O player continuará tentando automaticamente.';
      screen.appendChild(videoPrompt);
    }
    function attemptVideoStart(video, reload) {
      if (!video || currentVideo !== video) return;
      clearVideoStartTimer();
      if (reload && typeof video.load === 'function') { try { video.load(); } catch (e) {} }
      try {
        var result = video.play();
        if (result && result.catch) result.catch(function (error) {

          showVideoStartPrompt();
        });
      } catch (e) { diagnostics.fail('VIDEO_FORMAT'); }

        if (currentVideo !== video || (Number(video.currentTime) || 0) > 0 || video.paused === false) { markVideoStarted(video); return; }

        if (videoStartAttempts <= 2) { attemptVideoStart(video, true); return; }
        diagnostics.fail('AUTOPLAY_BLOCKED');
        showVideoStartPrompt();
        videoStartTimer = window.setTimeout(function () { attemptVideoStart(video, true); }, 30000);
      }, 10000);
    }
    function activatePlayer() {
      requestFullscreen();
      if (currentVideo) { videoStartAttempts = 0; attemptVideoStart(currentVideo, false); }
    }
    function clearLayoutTimers() {
      while (layoutTimers.length) window.clearInterval(layoutTimers.pop());
    }
    function clearFooterTimers() {
      while (footerTimers.length) window.clearInterval(footerTimers.pop());

    function requestFullscreen() {
      if (window.CorporateScreenPower) window.CorporateScreenPower.request();

      // funciona nos aparelhos que permitem fullscreen pelo player; nos demais
      // a mesma função será disparada no primeiro Enter, clique ou toque.
      var root = document.documentElement;

        var result = request.call(root);
        if (result && result.catch) result.catch(function () {});
      } catch (e) {}

    function createXHR() {

        if (status < 200 || status >= 300 || !data.id || !data.playerToken) {

          window.setTimeout(register, 15000);
          return;

        token = data.playerToken;
        write('corporate-screen.legacy.tvId', tvId);
        write('corporate-screen.legacy.playerToken', token);

          compatible: Boolean(window.JSON && createXHR()), browser: String(navigator.userAgent || 'Player legado').slice(0, 120), reason: 'Este navegador não possui os recursos básicos de comunicação do player.'
        }, { 'X-Player-Token': token }, function () {});

      });
    }
    function loadContent() {
      if (contentLoading || !tvId || !token) return;
      contentLoading = true;
      var requestStarted = new Date().getTime();
      request('POST', '/api/player/' + encodeURIComponent(tvId) + '/content', { playback: diagnostics.snapshot() }, { 'X-Player-Token': token }, function (status, data) {
        contentLoading = false;
        diagnostics.requestSample(new Date().getTime() - requestStarted, status);
        if (status === 401) { diagnostics.fail('PLAYER_UNAUTHORIZED'); showMessage('Dispositivo não autorizado', 'O token desta TV foi recusado. Não aprove outro cadastro sem verificar o aparelho. Consulte o administrador.'); return; }

        if (status < 200 || status >= 300) { diagnostics.network(); showMessage('Sem conexão', 'Não foi possível consultar a programação. Tentaremos novamente em 15 segundos.'); return; }
        diagnostics.content(data, false, false);
        if (data.pendenteAprovacao) { showMessage('Aguardando aprovação', 'Esta TV foi cadastrada. Aprove o dispositivo no painel administrativo.'); return; }
        if (data.dentroHorarioOperacional === false) { showMessage('Em espera', data.standbyReason || 'Fora do horário de exibição.'); return; }

        currentTV = data.tv || null;
        currentLayout = data.layout || null;

        if (contentChanged) { lastSignature = signature; items = playlist.itens.slice(0).sort(function (a, b) { return a.ordem - b.ordem; }); currentIndex = 0; }

        for (var syncIndex = 0; syncIndex < items.length; syncIndex += 1) {

    }
    function playSynchronized() {

    function playCurrent(synchronized, videoOffsetSeconds) {

      clearVideoStartTimer();
      removeVideoPrompt();
      currentVideo = null;
      videoStartAttempts = 0;
      clearLayoutTimers();

      if (window.CorporateScreenPower) window.CorporateScreenPower.setDesired(true);

      var media;
      var savedFooter = standardFooter;
      if (savedFooter && savedFooter.parentNode === screen) screen.removeChild(savedFooter);
      screen.innerHTML = '';
      if (item.tipo === 'video') {
        media = document.createElement('video');
        media.autoplay = true; media.muted = true; media.defaultMuted = true; media.volume = 0; media.preload = 'auto';
        media.setAttribute('autoplay', 'autoplay'); media.setAttribute('muted', 'muted'); media.setAttribute('preload', 'auto'); media.setAttribute('playsinline', ''); media.setAttribute('webkit-playsinline', '');
        if (typeof media.play !== 'function') {
          diagnostics.fail('VIDEO_UNSUPPORTED');
          media = document.createElement('div');
          media.className = 'message';
          media.innerHTML = '<div><h1>Vídeo não suportado</h1><p>Este navegador pode exibir imagens, mas não oferece vídeo HTML5.</p></div>';
          if (!synchronized) currentTimer = window.setTimeout(next, Math.max(3, Number(item.tempoExibicao) || 20) * 1000);

      if (tv.exibirRelogio !== false) blocks.push({ type: 'clock', weight: 10 });
      if (tv.exibirNoticias !== false) blocks.push({ type: 'news', weight: 70 });
      if (tv.exibirClima !== false) blocks.push({ type: 'weather', weight: 20 });
      if (!blocks.length) { standardFooter = null; footerSignature = signature; return; }
      var footer = document.createElement('div'); footer.className = 'standard-footer';
      var totalWeight = 0;
      for (var weightIndex = 0; weightIndex < blocks.length; weightIndex += 1) totalWeight += blocks[weightIndex].weight;
      for (var index = 0; index < blocks.length; index += 1) {
        var block = blocks[index];
        var cell = document.createElement('div'); cell.className = 'standard-footer-cell'; cell.style.width = (block.weight / totalWeight * 100) + '%';
        if (block.type === 'clock') appendClock(cell, footerTimers);
        if (block.type === 'news') appendNews(cell, footerTimers, footer);
        if (block.type === 'weather') appendWeather(cell, tv.cepClima || '');
        footer.appendChild(cell);
      }
      standardFooter = footer;
      footerSignature = signature;
      screen.appendChild(footer);
    }
    function getFooterSignature(tv) {
      tv = tv || {};
      return [tv.exibirRelogio !== false ? '1' : '0', tv.exibirNoticias !== false ? '1' : '0', tv.exibirClima !== false ? '1' : '0', String(tv.cepClima || '')].join(':');
    }
    function appendLayoutContent(node, component) {
      var type = component.tipo || 'texto';
      var content = component.conteudo || '';
      if (type === 'imagem' || type === 'logo') {
        var image = document.createElement('img'); image.src = content; node.appendChild(image); return;
      }
      if (type === 'video') {
        var video = document.createElement('video'); video.src = content; video.autoplay = true; video.muted = true; video.loop = true; video.setAttribute('muted', ''); video.setAttribute('playsinline', ''); node.appendChild(video); return;
      }
      if (type === 'dashboard' || type === 'pagina-web') {
        var frame = document.createElement('iframe'); frame.setAttribute('sandbox', 'allow-scripts allow-presentation'); frame.src = content; node.appendChild(frame); return;
      }
      if (type === 'relogio') { appendClock(node); return; }
      if (type === 'clima') { appendWeather(node, content); return; }
      if (type === 'noticias') { appendNews(node); return; }
      node.innerHTML = '<div class="layout-text"><div>' + escapeHtml(content) + '</div></div>';
    }
    function appendClock(node, timers) {
      node.innerHTML = '<div class="footer-widget footer-clock"><span class="footer-clock-content"><span class="footer-clock-time"></span><span class="footer-clock-date"></span></span></div>';
      var output = node.getElementsByTagName('span');
      function update() { var now = new Date(); output[1].innerHTML = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2); output[2].innerHTML = shortDay(now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2)) + ' • ' + ('0' + now.getDate()).slice(-2) + '/' + ('0' + (now.getMonth() + 1)).slice(-2); }
      update(); (timers || layoutTimers).push(window.setInterval(update, 1000));
    }
    function appendWeather(node, place) {
      node.innerHTML = '<div class="footer-widget"><div>Carregando clima...</div></div>';
      var output = node.getElementsByTagName('div')[1];
      var digits = String(place || '').replace(/\D/g, '');
      if (digits.length !== 8 && !String(place || '').replace(/^\s+|\s+$/g, '')) { output.innerHTML = 'Configure o CEP desta TV'; return; }
      var url = '/api/widgets/weather?' + (digits.length === 8 ? 'cep=' + encodeURIComponent(digits) : 'cidade=' + encodeURIComponent(place || ''));
      request('GET', url, null, null, function (status, data) {
        if (status >= 200 && status < 300) {
          var days = data.previsaoSemanal || [];
          var forecast = '';
          for (var i = 1; i < days.length && i < 4; i += 1) forecast += '<span class="footer-weather-day">' + escapeHtml(shortDay(days[i].data)) + '<span>' + weatherEmoji(days[i].codigo) + '</span>' + escapeHtml(Math.round(days[i].temperaturaMaxima)) + '°</span>';
          output.innerHTML = '<span class="footer-weather-current"><span class="footer-weather-icon">' + weatherEmoji(data.codigo) + '</span><span class="footer-weather-temp">' + escapeHtml(Math.round(data.temperatura)) + '°</span><span class="footer-weather-city">' + escapeHtml(data.cidade) + '</span></span><span class="footer-weather-days">' + forecast + '</span>';
        }
        else output.innerHTML = 'Clima indisponível';
      });
    }
    function appendNews(node, timers, ownerFooter) {
      node.innerHTML = '<div class="footer-widget layout-news"><div></div></div>';
      var output = node.getElementsByTagName('div')[1];
      var started = false;
      function start(items) {
        if (started || !items.length) return;
        started = true;
        var itemIndex = 0;
        function show() { var item = items[itemIndex % items.length]; output.innerHTML = (item.imagem ? '<img class="footer-news-image" src="' + escapeHtml(item.imagem) + '" alt="">' : '') + '<div class="footer-news-source">▣ ' + escapeHtml(item.fonte || 'NOTÍCIAS') + ' <span class="footer-news-category">• ' + escapeHtml(item.fonteCategoria || 'Notícias') + '</span></div><div class="footer-news-title">' + escapeHtml(item.titulo) + '</div>' + (item.resumo ? '<div class="footer-news-summary">' + escapeHtml(stripTags(item.resumo)) + '</div>' : '') + '<div class="footer-news-date">' + escapeHtml(formatNewsDate(item.publicadoEm)) + '</div>'; itemIndex += 1; output.style.opacity = '1'; }
        function advance() { output.style.opacity = '0'; (timers || layoutTimers).push(window.setTimeout(function () { show(); }, 400)); }
        show(); if (items.length > 1) (timers || layoutTimers).push(window.setInterval(advance, 15000));
      }
      if (newsItemsCache.length) start(newsItemsCache);
      request('GET', '/api/widgets/news', null, null, function (status, data) {
        var items = status >= 200 && status < 300 && data && data.length ? data : [];
        if (!items.length) { if (!started) output.innerHTML = 'Notícias indisponíveis'; return; }
        newsItemsCache = items;
        if (ownerFooter && standardFooter !== ownerFooter) return;
        start(items);
      });
    }
    function weatherEmoji(code) { code = Number(code); if (code === 0 || code === 1) return '☀️'; if (code === 2 || code === 3) return '⛅'; if (code === 45 || code === 48) return '🌫️'; if (code >= 51 && code <= 67) return '🌧️'; if (code >= 71 && code <= 77) return '❄️'; if (code >= 80 && code <= 82) return '🌦️'; if (code >= 95) return '⛈️'; return '🌤️'; }
    function shortDay(value) { var date = new Date(String(value) + 'T12:00:00'); var labels = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB']; return isNaN(date.getTime()) ? '' : labels[date.getDay()]; }
    function stripTags(value) { return String(value || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, ''); }
    function formatNewsDate(value) { var date = new Date(value); if (isNaN(date.getTime())) return 'Atualização automática'; return ('0' + date.getDate()).slice(-2) + '/' + ('0' + (date.getMonth() + 1)).slice(-2) + ' ' + ('0' + date.getHours()).slice(-2) + ':' + ('0' + date.getMinutes()).slice(-2); }
    function next() { currentIndex = (currentIndex + 1) % items.length; playCurrent(); }
    function onEvent(target, name, handler) {
      if (target.addEventListener) target.addEventListener(name, handler, false);
      else if (target.attachEvent) target.attachEvent('on' + name, handler);
    }
    onEvent(document, 'click', activatePlayer);
    onEvent(document, 'touchend', activatePlayer);
    onEvent(document, 'keydown', function (event) {
      var key = event && (event.keyCode || event.which);
      if (key === 13 || key === 32) activatePlayer();
    });
    window.setInterval(loadContent, 15000);
    register();
  }());
  </script>
